# Mecville — Nginx Configuration
#
# This config serves the React frontend (static build) and proxies
# API requests to the Express backend running on port 3001.
#
# Setup:
#   1. Copy to /etc/nginx/sites-available/mecville
#   2. ln -s /etc/nginx/sites-available/mecville /etc/nginx/sites-enabled/
#   3. Obtain SSL cert: sudo certbot --nginx -d mecville.com -d www.mecville.com -d api.mecville.com
#   4. sudo nginx -t && sudo systemctl reload nginx

# ── Frontend (static React build) ─────────────────────────
server {
    listen 80;
    server_name mecville.com www.mecville.com;
    root /var/www/mecville/frontend/dist;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security headers (supplements what Helmet sets on the API)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static assets with long cache (Vite hashes filenames)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # robots.txt and sitemap.xml — no caching
    location = /robots.txt {
        expires 1h;
        add_header Cache-Control "public";
    }
    location = /sitemap.xml {
        expires 1h;
        add_header Cache-Control "public";
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # Logo and favicon
    location = /logo.webp {
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA fallback — serve index.html for all client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy — forward /api to the Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}

# ── API-only subdomain (optional — for webhooks that need a direct URL) ──
server {
    listen 80;
    server_name api.mecville.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
}