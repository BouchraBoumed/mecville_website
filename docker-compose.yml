# Mecville — Docker Compose
#
# Usage:
#   docker compose up -d          # start in background
#   docker compose logs -f        # view logs
#   docker compose down           # stop
#
# Create back-end/.env before running (see back-end/.env.example).
# The frontend env vars are baked at build time — rebuild after changing.

services:
  mecville:
    build: .
    container_name: mecville
    restart: unless-stopped
    ports:
      - "80:80"
    env_file:
      - back-end/.env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s